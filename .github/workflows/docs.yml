name: Docs

on:
  # Standalone manual publish (e.g. backfilling docs without cutting a release).
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build docs from. Blank = the branch this run is dispatched from."
        type: string
        required: false
        default: ""
  # Invoked by release.yml so release and standalone runs share one definition.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build docs from."
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Build and publish API docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A blank ref makes checkout fall back to the dispatching ref.
          ref: ${{ inputs.ref }}

      - uses: oprypin/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: "1.20.2"

      - name: Install shards
        # --without-development skips ameba without requiring a committed shard.lock
        run: shards install --without-development

      - name: Build API docs
        run: crystal docs --canonical-base-url=https://lowkeyliesmyth.github.io/kyaml/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
