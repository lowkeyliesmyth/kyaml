# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  actionlint:
    desc: Analyze GitHub Actions workflows
    cmds:
      #- actionlint
      - zizmor .

  actionlint:fix:
    desc: Analyze and fix GHA workflows
    cmds:
      - zizmor . --fix=all

  coverage:
    desc: Run code coverage
    cmds:
      - scripts/coverage.sh

  default:
    desc: Run default spec-lint checks
    deps: [spec, lint]

  docs:
    desc: Generates API usage docs from inline docstrings
    cmds:
      - crystal docs

  lint:
    desc: Run Ameba linter
    deps: [lint:build]
    cmds:
      - bin/ameba

  lint:build:
    desc: Compile ameba linter
    cmds:
      - shards install
      - mkdir -p bin
      - crystal build -o bin/ameba lib/ameba/bin/ameba.cr
    status:
      - test -x bin/ameba
      - test bin/ameba -nt shard.lock

  lint:fix:
    desc: Address fixable linter violations
    deps: [lint:build]
    cmds:
      - bin/ameba --fix

  spec:
    desc: Run Crystal specs
    cmds:
      - crystal spec --order random

  bench:baseline:
    desc: Validate workloads and run a baseline benchmark
    deps: [lint, spec]
    cmds:
      - mkdir -p bin bench/results
      - crystal build bench/baseline.cr --release -o bin/kyaml-baseline
      - |
        set -eu
        {
        date -u
        git log -1 --format="source-revision=%H"
        sysctl -n machdep.cpu.brand_string
        shasum -a 256 bench/baseline.cr bench/workloads.cr bench/workloads/small.yaml bench/workloads/deployment.yaml
        bin/kyaml-baseline
        } > bench/results/baseline.txt
        cat bench/results/baseline.txt
