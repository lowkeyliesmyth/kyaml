# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  actionlint:
    desc: Analyze GitHub Actions workflows
    cmds:
      #- actionlint
      - zizmor .

  actionlint:fix:
    desc: Analyze and fix GHA workflows
    cmds:
      - zizmor . --fix=all

  coverage:
    desc: Run code coverage
    cmds:
      - scripts/coverage.sh

  default:
    desc: Run default spec-lint checks
    deps: [spec, lint]

  docs:
    desc: Generates API usage docs from inline docstrings
    cmds:
      - crystal docs

  lint:
    desc: Run Ameba linter
    deps: [lint:build]
    cmds:
      - bin/ameba

  lint:build:
    desc: Compile ameba linter
    cmds:
      - shards install
      - mkdir -p bin
      - crystal build -o bin/ameba lib/ameba/bin/ameba.cr
    status:
      - test -x bin/ameba
      - test bin/ameba -nt shard.lock

  lint:fix:
    desc: Address fixable linter violations
    deps: [lint:build]
    cmds:
      - bin/ameba --fix

  spec:
    desc: Run Crystal specs
    cmds:
      - crystal spec --order random
