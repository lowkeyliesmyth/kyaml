# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  spec:
    desc: Run Crystal specs
    cmds:
      - crystal spec --order random

  lint:
    desc: Run Ameba linter
    deps: [lint:build]
    cmds:
      - bin/ameba

  lint:build:
    desc: Compile ameba linter
    cmds:
      - shards install
      - mkdir -p bin
      - crystal build -o bin/ameba lib/ameba/bin/ameba.cr
    status:
      - test -x bin/ameba
      - test bin/ameba -nt shard.lock

  coverage:
    desc: Run code coverage
    cmds:
      - scripts/coverage.sh

  actionlint:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  docs:
    desc: Generates API usage docs from inline docstrings
    cmds:
      - crystal docs

  default:
    desc: Run default spec-lint checks
    deps: [spec, lint]
